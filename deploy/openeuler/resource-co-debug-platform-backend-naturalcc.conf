[Unit]
Wants=naturalcc.service
After=naturalcc.service

[Service]
SupplementaryGroups=naturalcc-workspace
ExecStartPre=/bin/sh -c 'for _ in 1 2 3 4 5; do /usr/bin/curl --fail --silent --show-error --max-time 5 http://127.0.0.1:7860/api/health && exit 0; /usr/bin/sleep 5; done; exit 1'
Restart=on-failure
